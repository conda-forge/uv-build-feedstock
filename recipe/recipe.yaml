# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.9"
  python_check_max: "3.15"
  cargo_wrapper: cargo-auditable-wrapper.${{ "bat" if win else "sh" }}

package:
  name: uv-build
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/u/uv-build/uv_build-${{ version }}.tar.gz
  sha256: 3ae0466d17e38b82ed52d5201b5f265bbd782403b2e5a62cff244072af61a9fd

build:
  number: 0
  skip: not is_python_min
  python:
    version_independent: true
  script:
    env:
      CARGO: ${{ cargo_wrapper }}
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: win
        then:
          - copy "%RECIPE_DIR%\${{ cargo_wrapper }}" "%BUILD_PREFIX%\Library\bin\"
        else:
          - cp "${RECIPE_DIR}/${{ cargo_wrapper }}" "${BUILD_PREFIX}/bin/"
          - chmod 755 "${BUILD_PREFIX}/bin/${{ cargo_wrapper }}"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
        - python ${{ python_min }}.*
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=1.0,<2.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      bin:
        - uv-build
      site_packages:
        - uv_build/**
        - uv_build-${{ version }}.dist-info/**
  - python:
      imports: uv_build
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - uv-build --help

about:
  summary: The uv build backend
  license: Apache-2.0 AND MIT AND BSD-2-Clause
  homepage: https://pypi.org/project/uv-build
  license_file:
    - LICENSE-*
    - crates/*/License-*
    - THIRDPARTY.yml
  repository: https://github.com/astral-sh/uv
  documentation: https://docs.astral.sh/uv/concepts/build-backend

extra:
  recipe-maintainers:
    - zklaus
    - isuruf
    - conda-forge/uv
