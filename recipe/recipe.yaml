# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.13.4"
  python_check_max: "3.14"

package:
  name: uv-build
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/4a/43/4322239e0113e8228d20c2b8d7851e245b55b9f3ce410a83ad659bc772f7/uv_build-${{ version }}.tar.gz
  sha256: 93399c547230b849cf725775b0c1c990927c02ddea503e7504736c84c54be9d8

build:
  number: 0
  skip: not is_python_min
  python:
    version_independent: true
  script:
    env:
      CARGO: cargo-auditable-wrapper.${{ "bat" if win else "sh" }}
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: win
        then:
          - copy "%RECIPE_DIR%\cargo-auditable-wrapper.bat" "%BUILD_PREFIX%\Library\bin\"
        else:
          - cp "${RECIPE_DIR}/cargo-auditable-wrapper.sh" "${BUILD_PREFIX}/bin/"
          - chmod 755 "${BUILD_PREFIX}/bin/cargo-auditable-wrapper.sh"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ host_platform }}
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=1.0,<2.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: uv_build
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - uv-build --help

about:
  summary: The uv build backend
  license: Apache-2.0 AND MIT AND BSD-2-Clause
  homepage: https://pypi.org/project/uv-build
  license_file:
    - LICENSE-*
    - crates/*/License-*
    - THIRDPARTY.yml
  repository: https://github.com/astral-sh/uv
  documentation: https://docs.astral.sh/uv/concepts/build-backend

extra:
  recipe-maintainers:
    - zklaus
    - isuruf
    - conda-forge/uv
